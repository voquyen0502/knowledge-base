site_name: Engineering Wiki
site_description: Personal Technical Knowledge Base & System Architecture Notes
site_url: https://voquyen0502.github.io/knowledge-base/
# repo_url: https://github.com/voquyen0502/knowledge-base
# repo_name: knowledge-base
# edit_uri: edit/main/docs/

theme:
  name: material
  language: vi
  custom_dir: overrides
  icon:
    logo: material/book-open-page-variant-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: "#5c7526"
      toggle:
        icon: material/weather-night
        name: Chuyển sang Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: "#5c7526"
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang Light Mode
  font:
    text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
    code: JetBrains Mono, SFMono-Regular, Consolas, monospace
  features:
    # Điều hướng SPA & TOC
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    # Tương tác nội dung & Mã nguồn
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - content.tabs.link
    # Tìm kiếm
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search:
      lang: [vi, en]
      separator: '[\s\-\.]+'
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: date
      fallback_to_build_date: true
  - encryptcontent:
      title_prefix: ""
      title: "Tài liệu bảo mật"
      summary: "Kho tri thức này được bảo vệ. Vui lòng nhập mật khẩu để mở khóa."
      placeholder: "Nhập mật khẩu truy cập..."
      # Đọc mật khẩu từ ENV của GitHub Actions, fallback về mật khẩu local khi test máy cá nhân
      password: !ENV [WIKI_PASSWORD, "MatKhauLocalTamThoi2026!"]
      remember_password: true     # Lưu token vào sessionStorage (không phải nhập lại mỗi khi chuyển trang)

hooks:
  - hooks/auto_encrypt.py

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: "#"
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

extra_css:
  - stylesheets/book-theme.css

extra_javascript:
  - javascripts/nav-collapse.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/unlock-tracker.js

extra:
  homepage: "/"

