{# Override partials/content.html — thêm id + tabindex để skip-link nhảy được tới nội dung (WCAG 2.4.1). #}
{# Cấu trúc bám sát theme gốc; chỉ thêm 2 attribute id + tabindex. #}
<article id="main-content" tabindex="-1" class="md-content__inner md-typeset">
  {% block content %}
    {% if page.content %}
      {{ page.content }}
    {% endif %}
  {% endblock %}
</article>
