name: Deploy Knowledge Base

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Bắt buộc cho git-revision-date-localized

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-mkdocs-${{ hashFiles('**/requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: |
            ${{ runner.os }}-mkdocs-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-encryptcontent-plugin
          fi

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and Deploy
        env:
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: mkdocs gh-deploy --force